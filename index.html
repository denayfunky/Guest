<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resepsionis Check-in & Souvenir</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Library QR Code Scanner -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #f4f6f9; }
    .card-custom { border-radius: 14px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); border: none; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-7">
        <div class="card card-custom p-4 bg-white">
          <h3 class="text-center mb-1 text-primary fw-bold">Check-in Tamu & Souvenir</h3>
          <p class="text-center text-muted small mb-4">Scan QR Code undangan atau cari data tamu secara manual</p>
          
          <!-- Tombol Buka Kamera Scanner -->
          <div class="text-center mb-3">
            <button class="btn btn-outline-primary px-4 py-2 fw-bold" type="button" onclick="toggleScanner()">
              📷 Scan QR Code Tamu
            </button>
          </div>
          
          <!-- Area Kamera Scanner -->
          <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto 20px auto; display: none;"></div>

          <!-- Form Pencarian Manual -->
          <div class="input-group mb-4">
            <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Nama, No. Telepon, atau Kode Unik..." autocomplete="off">
            <button class="btn btn-primary px-4 fw-bold" type="button" onclick="handleSearch()">Cari</button>
          </div>

          <!-- Area Hasil Pencarian -->
          <div id="resultArea"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5hOPqP-vVasQBx7VD9bYwm8pGsLHixcxWZQECMsY6bTJpVt8Hk5E6ewu8lLO9TfpLRA/exec";
    // =========================================================================

    let html5QrcodeScanner = null;

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') handleSearch();
    });

    function toggleScanner() {
      const readerDiv = document.getElementById('reader');
      if (readerDiv.style.display === 'none') {
        readerDiv.style.display = 'block';
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
      } else {
        closeScanner();
      }
    }

    function closeScanner() {
      document.getElementById('reader').style.display = 'none';
      if (html5QrcodeScanner) {
        html5QrcodeScanner.clear().catch(err => console.error("Gagal menutup scanner:", err));
      }
    }

    function onScanSuccess(decodedText) {
      document.getElementById('searchInput').value = decodedText;
      closeScanner();
      handleSearch();
    }

      const keyword = document.getElementById('searchInput').value.trim();
      const resultArea = document.getElementById('resultArea');
