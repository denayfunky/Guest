<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Guest Management</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--navy:#17365D;--green:#16834a;--red:#b42318;--bg:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#172033;font-family:Arial,sans-serif}
header{background:var(--navy);color:white;padding:18px 16px}
header h1{font-size:19px;margin:0 0 5px}
header p{font-size:12px;margin:0;opacity:.85}
main{max-width:560px;margin:16px auto;padding:0 12px 28px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #13294b12}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
button{border:0;background:var(--navy);color:white;padding:14px 16px;border-radius:10px;font-size:15px;font-weight:bold;width:100%;margin-top:12px}
button.secondary{background:#e8eef6;color:var(--navy)}
#reader{width:100%;overflow:hidden;border-radius:12px}
.hint{font-size:12px;color:#64748b;line-height:1.5}
#result{display:none;border-radius:12px;padding:16px;margin-top:12px}
#result.good{display:block;background:#e5f5eb;border:1px solid #9ad3ae;color:#14532d}
#result.bad{display:block;background:#fff0ed;border:1px solid #f2b4aa;color:#8a1c13}
#result h2{margin:0 0 7px;font-size:18px}
#result p{margin:6px 0;font-size:14px;overflow-wrap:anywhere}
.mode{display:inline-block;border-radius:99px;background:#e8eef6;color:var(--navy);padding:6px 10px;font-size:12px;font-weight:bold}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.api{font-size:11px;color:#64748b;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>Resepsionis QR</h1>
<p>Birthday Louis • Marqen Hotel 28 November 2026</p>
</header>
<main>
<section class="card">
<span class="mode" id="modeLabel">CHECK-IN TAMU</span>
<label>Mode transaksi</label>
<select id="mode" onchange="changeMode()">
<option value="checkin">Check-in tamu</option>
<option value="souvenir">Penukaran souvenir</option>
</select>
<label>Nama petugas</label>
<input id="operator" placeholder="Contoh: Resepsionis 1" autocomplete="name">
</section>

<section class="card">
<label>Kamera</label>
<select id="cameraSelect">
<option value="">Kamera utama / belakang</option>
</select>
<div id="reader"></div>
<p class="hint" id="cameraHint">Izinkan akses kamera. Gunakan Chrome dan tautan HTTPS.</p>
<div class="row">
<button onclick="startScanner()">Mulai kamera</button>
<button class="secondary" onclick="stopScanner()">Hentikan</button>
</div>
<label>Input kode secara manual (opsional)</label>
<input id="manualCode" placeholder="Tempel / ketik ID QR">
<button class="secondary" onclick="manualSubmit()">Proses kode manual</button>
</section>

<section id="result"></section>

<section class="card">
<p class="hint">Grace and Irene 2026.</p>
<p class="api">API: <span id="apiStatus">Menghubungkan…</span></p>
</section>
</main>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbzKhg4cRIqg6TFyQa75Ims3S41fqIRdAcptWqX5LMA58DEHeqVSEcK6cWjxn795OBtQlg/exec';

let scanner=null,busy=false,lastCode='',cameras=[];
const params=new URLSearchParams(location.search);

function currentMode(){
 return document.getElementById('mode').value;
}

function changeMode(){
 document.getElementById('modeLabel').textContent=
 currentMode()==='souvenir'?'PENUKARAN SOUVENIR':'CHECK-IN TAMU';
 showResult('','','');
}

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
 }[c]));
}

function showResult(kind,title,detail){
 const b=document.getElementById('result');
 if(!kind){
  b.style.display='none';
  b.className='';
  return;
 }
 b.style.display='block';
 b.className=kind;
 b.innerHTML='<h2>'+esc(title)+'</h2>'+detail;
}

function callAppsScript(payload){
 return new Promise((resolve,reject)=>{
  const callback='gasCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  script.async=true;
  let finished=false;

  const timer=setTimeout(()=>{
   finish(new Error('Server tidak merespons. Periksa deployment dan izin akses Web App.'));
  },20000);

  function finish(err,data){
   if(finished)return;
   finished=true;
   clearTimeout(timer);
   try{delete window[callback]}catch(e){window[callback]=undefined}
   script.remove();
   err?reject(err):resolve(data);
  }

  window[callback]=data=>finish(null,data);

  const query=new URLSearchParams({
   ...payload,
   callback,
   _:Date.now().toString()
  });

  script.onerror=()=>{
   finish(new Error('Tidak dapat mengakses API Apps Script. Pastikan Web App dapat diakses oleh siapa saja yang memiliki tautan.'));
  };

  script.src=API_URL+'?'+query.toString();
  document.head.appendChild(script);
 });
}

// Membersihkan hasil scan QR dari spasi dan karakter tersembunyi.
function normalizeQrCode(value){
 let code=String(value??'').normalize('NFKC')
  .replace(/[\u200B-\u200D\uFEFF]/g,'')
  .replace(/[\u0000-\u001F\u007F]/g,'')
  .trim();

 // Jika QR berisi URL, ambil parameter kode/ID bila tersedia.
 if(/^https?:\/\//i.test(code)){
  try{
   const u=new URL(code);
   const fromUrl=
    u.searchParams.get('code')||
    u.searchParams.get('id')||
    u.searchParams.get('qr');

   if(fromUrl)code=fromUrl.trim();
  }catch(e){}
 }

 return code;
}

function processCode(rawCode){
 const code=normalizeQrCode(rawCode);

 if(busy)return;

 if(!code){
  showResult('bad','Kode QR kosong',
   '<p>QR terbaca, tetapi tidak berisi kode yang dapat diproses.</p>');
  return;
 }

 const operator=document.getElementById('operator').value.trim();

 if(!operator){
  showResult('bad','Isi nama resepsionis',
   '<p>Masukkan nama resepsionis sebelum memindai QR.</p>');
  return;
 }

 busy=true;
 showResult('','','');

 callAppsScript({
  action:'scan',
  code,
  mode:currentMode(),
  operator,
  userAgent:navigator.userAgent
 }).then(res=>{
  const g=res.guest||{};
  let d='';

  if(g.name)d+='<p><b>Nama tamu:</b> '+esc(g.name)+'</p>';
  if(g.phone)d+='<p><b>No. telepon:</b> '+esc(g.phone)+'</p>';
  if(g.category)d+='<p><b>Kategori:</b> '+esc(g.category)+'</p>';

  if(g.name){
   d+='<p><b>Dewasa:</b> '+esc(g.adults)+
   ' &nbsp; <b>Anak:</b> '+esc(g.children)+
   ' &nbsp; <b>Suster:</b> '+esc(g.nannies)+'</p>';
  }

  if(currentMode()==='souvenir'&&g.name){
   d+='<p><b>Jatah souvenir:</b> '+esc(g.qtySouvenir)+' buah</p>';
   d+='<p><b>resepsionis yang melayani:</b> '+
   esc(res.souvenirOperator||g.souvenirOperator||operator)+'</p>';
  }else if(g.name){
   d+='<p><b>Jatah souvenir:</b> '+esc(g.qtySouvenir)+' buah</p>';
   d+='<p><b>Petugas:</b> '+esc(operator)+'</p>';
  }

  d+='<p><b>Waktu server:</b> '+esc(res.timestamp||'')+'</p>';

  if(res.message)d+='<p>'+esc(res.message)+'</p>';

  showResult(
   res.ok?'good':'bad',
   res.ok?'BERHASIL':(res.status||'GAGAL'),
   d||'<p>Respons server kosong.</p>'
  );

  document.getElementById('manualCode').value='';
  busy=false;
  lastCode=code;

  setTimeout(()=>{
   lastCode='';
   if(scanner?.isScanning)scanner.resume();
  },1800);

 }).catch(err=>{
  showResult('bad','Gagal menghubungi server',
   '<p>'+esc(err.message||err)+'</p>');

  busy=false;

  setTimeout(()=>{
   if(scanner?.isScanning)scanner.resume();
  },2000);
 });
}

// Hasil scan kamera dibersihkan sebelum diproses.
function onScanSuccess(decoded){
 const code=normalizeQrCode(decoded);

 if(busy||!code||code===lastCode)return;

 if(scanner?.isScanning)scanner.pause(true);

 processCode(code);
}

async function refreshCameras(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   document.getElementById('cameraHint').textContent=
   'Browser tidak menyediakan akses kamera. Buka GitHub Pages melalui Chrome.';
   return;
  }

  const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'environment'}
  });

  stream.getTracks().forEach(t=>t.stop());

  cameras=await Html5Qrcode.getCameras();

  const sel=document.getElementById('cameraSelect');
  sel.innerHTML='';

  cameras.forEach((c,i)=>{
   const o=document.createElement('option');
   o.value=c.id;
   o.textContent=c.label||('Kamera '+(i+1));
   sel.appendChild(o);
  });

  const back=cameras.find(c=>
   /back|rear|environment|belakang/i.test(c.label)
  );

  if(back)sel.value=back.id;

  document.getElementById('cameraHint').textContent=
   cameras.length?
   'Pilih kamera belakang jika tersedia, lalu mulai scan.':
   'Kamera tidak ditemukan.';

 }catch(e){
  document.getElementById('cameraHint').textContent=
  'Akses kamera gagal: '+e.message;
 }
}

async function startScanner(){
 if(!window.Html5Qrcode){
  showResult('bad','Scanner tidak termuat',
   '<p>Periksa internet lalu muat ulang halaman.</p>');
  return;
 }

 try{
  if(!scanner)scanner=new Html5Qrcode('reader');

  const id=document.getElementById('cameraSelect').value;

  await scanner.start(
   id||{facingMode:'environment'},
   {fps:10,qrbox:{width:240,height:240}},
   onScanSuccess,
   ()=>{}
  );

  document.getElementById('cameraHint').textContent=
  'Kamera aktif. Arahkan QR ke kotak scan.';

 }catch(e){
  showResult('bad','Kamera tidak dapat dibuka',
   '<p>'+esc(e.message||e)+'</p>');
 }
}

async function stopScanner(){
 if(scanner?.isScanning){
  try{await scanner.stop()}catch(e){}
 }
}

function manualSubmit(){
 const c=document.getElementById('manualCode').value.trim();

 if(!c){
  showResult('bad','Kode kosong','<p>Masukkan ID QR.</p>');
  return;
 }

 processCode(c);
}

window.addEventListener('load',()=>{
 document.getElementById('mode').value=
 params.get('mode')==='souvenir'?'souvenir':'checkin';

 changeMode();

 document.getElementById('apiStatus').textContent=
 'Server Terhubung';

 if(!window.isSecureContext){
  document.getElementById('cameraHint').textContent=
  'Halaman harus HTTPS. Gunakan GitHub Pages.';
 }else if(window.Html5Qrcode){
  refreshCameras();
 }else{
  document.getElementById('cameraHint').textContent=
  'Library scanner gagal dimuat. Periksa koneksi internet.';
 }
});
</script>
</body>
</html>
